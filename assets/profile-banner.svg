<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Oleksandr Maslov</title>
  <desc id="desc">Hardware, firmware, and interaction. A source node connects to selected projects against a dark field.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060d"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00f0c8" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#00f0c8" stop-opacity=".035"/>
      <stop offset="1" stop-color="#00f0c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2536" stroke-width="1" opacity=".4"/>
    </pattern>
    <clipPath id="right"><rect x="650" y="0" width="550" height="360"/></clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#field)"/>
  <g clip-path="url(#right)">
    <rect x="650" width="550" height="360" fill="url(#grid)" opacity=".55"/>
    <circle cx="926" cy="190" r="240" fill="url(#glow)"/>
    <circle cx="926" cy="190" r="125" fill="none" stroke="#00f0c8" stroke-opacity=".18"/>
    <circle cx="926" cy="190" r="82" fill="none" stroke="#00f0c8" stroke-opacity=".12"/>
    <circle cx="926" cy="190" r="38" fill="none" stroke="#00f0c8" stroke-opacity=".32"/>
    <circle cx="926" cy="190" r="8" fill="#00f0c8"/>
    <circle cx="926" cy="190" r="17" fill="none" stroke="#00f0c8" stroke-opacity=".5"/>

    <path d="M926 190 755 88M926 190 1087 79M926 190 1094 280M926 190 761 290" fill="none" stroke="#00a88c" stroke-opacity=".42"/>
    <path d="M755 88 710 88M1087 79h45M1094 280h54M761 290h-46" fill="none" stroke="#00a88c" stroke-opacity=".42"/>
    <g fill="#00f0c8">
      <circle cx="755" cy="88" r="4"/><circle cx="1087" cy="79" r="4"/>
      <circle cx="1094" cy="280" r="4"/><circle cx="761" cy="290" r="4"/>
    </g>
    <g fill="#9aa3b3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5">
      <text x="710" y="75">0x01 WAFER</text>
      <text x="1030" y="61">0x02 KERFUR</text>
      <text x="1050" y="303">0x03 ISKRA</text>
      <text x="680" y="312">0x06 STUDIO</text>
    </g>
    <text x="904" y="228" fill="#00f0c8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">0x00</text>
  </g>

  <path d="M28 28h22M28 28v22M1172 28h-22M1172 28v22M28 332h22M28 332v-22M1172 332h-22M1172 332v-22" fill="none" stroke="#00f0c8" stroke-opacity=".75" stroke-width="1.5"/>
  <path d="M60 75h470M60 310h470" stroke="#232a3a" stroke-width="1"/>
  <rect x="60" y="42" width="6" height="6" fill="#00f0c8"/>
  <text x="78" y="49" fill="#9aa3b3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4">M.O. / SOURCE NODE</text>
  <text x="60" y="166" fill="#e6e8ee" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="600" letter-spacing="-3">Oleksandr</text>
  <text x="60" y="239" fill="#e6e8ee" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="600" letter-spacing="-3">Maslov</text>
  <text x="60" y="289" fill="#00f0c8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.8">HARDWARE  +  FIRMWARE  +  INTERACTION</text>
  <text x="60" y="334" fill="#7a8499" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5">MUNICH, DE</text>
  <text x="449" y="334" fill="#7a8499" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5">PORTFOLIO / GITHUB</text>
</svg>
